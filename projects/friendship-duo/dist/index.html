<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="两个人，各答八道小问题。把合拍、分歧和照顾彼此的方式，写成一份闺蜜相处说明书。">
  <title>闺蜜相处说明书 · 测测你的理想好友</title>
  <link rel="icon" href="assets/icon.jpg">
  <link rel="stylesheet" href="style.css">
  <script src="core.js" defer></script>
  <script src="platform.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a href="#" id="brand" aria-label="回到首页"><span class="brandmark">友</span>朋友观察手册</a><span class="edition">双人篇</span></header>

  </dialog>
